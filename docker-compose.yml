services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    container_name: opencode
    user: "1000:1000"  # чтобы совпадало с владельцем shared folder
    # Доступ к docker-сокету хоста (Do-oD): сокет принадлежит root:<docker-gid> 0660,
    # а контейнер работает под UID 1000. GID на VM: stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-986}"

    # Веб-интерфейс OpenCode. Сервис внутри контейнера слушает 0.0.0.0:49374
    # (hostname/port заданы в config/service.json), а здесь порт публикуется на VM:
    #   http://192.168.100.100:49374
    ports:
      - "49374:49374"

    volumes:
      # for DooD
      - /var/run/docker.sock:/var/run/docker.sock
      # === ВАШИ ПРОЕКТЫ ===
      # Вариант А: проекты лежат на хосте, проброшены через Vagrant
      - /home/vagrant/shared/:/workspace

      
      # === НАСТРОЙКИ OPENCODE (переживут пересоздание VM!) ===
      - /home/vagrant/shared/opencode/config:/home/appuser/.config/opencode
      - /home/vagrant/shared/opencode/state:/home/appuser/.local/state/opencode
      - /home/vagrant/shared/opencode/data:/home/appuser/.local/share/opencode
      
      # === КЭШ MAVEN (критично! без этого каждый раз качать зависимости) ===
      - maven-cache:/home/appuser/.m2/repository

      # === ВРЕМЕННОЕ (venv, кэши npm/NuGet и прочее) ===
      # Вне vboxfs (там нет симлинков) — работают симлинки и запись.
      # Временное: VM/том могут быть пересозданы, всё внутри восстанавливается.
      # Том смонтирован НА home контейнера (/home/appuser): поэтому ~ == opencodetmp,
      # и каталог приложения Persinder (~/.persinder) с моделями лежит в томе.
      - opencodetmp:/home/appuser
      
    working_dir: /workspace
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      # PAT для github.com (см. .env); используется git credential helper'ом из образа
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - JAVA_HOME=/opt/java/openjdk
    
    # PID 1 — только сервер (API + веб). TUI подключается отдельным клиентом:
    #   docker exec -it opencode opencode
    # Так TUI стартует уже с твоим терминалом и сразу включает захват мыши
    # и alternate screen; иначе после перезапуска колесо крутит scrollback хоста.
    command: >
      opencode serve --service --hostname 0.0.0.0 --port 49374
    # git config --global --add safe.directory /workspace/photositesrc &&
    # git config --global --add safe.directory /workspace/artplanlibs &&

volumes:
  maven-cache:  # named volume — быстро, но внутри VM
  opencodetmp:  # временное: venv проектов, кэши; вне vboxfs (симлинки работают)